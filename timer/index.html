<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="icon" href="/favicon.ico">
<title>Timer</title>
<style>
:root{
  color-scheme: light dark;
  padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  --bg:#E8EBE7; --surface:#F4F7F3; --card:#FCFDFB;
  --ink:#141A18; --muted:#5C6A64; --line:#C7D0CB; --line-soft:#DCE3DE;
  --accent:#1B6B5B; --accent-ink:#0F4A3E; --accent-soft:#D6E5DF;
  --bronze:#8A6634; --flag:#9C4237; --flag-soft:#EFDDD9;
  --f-display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Courier Prime", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#141B19; --card:#18211E;
    --ink:#E6ECE9; --muted:#92A39C; --line:#26322E; --line-soft:#1E2926;
    --accent:#5FC2A8; --accent-ink:#8FD8C4; --accent-soft:#12302A;
    --bronze:#C29553; --flag:#E08A7E; --flag-soft:#33211E;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#141B19; --card:#18211E;
  --ink:#E6ECE9; --muted:#92A39C; --line:#26322E; --line-soft:#1E2926;
  --accent:#5FC2A8; --accent-ink:#8FD8C4; --accent-soft:#12302A;
  --bronze:#C29553; --flag:#E08A7E; --flag-soft:#33211E;
}
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:1.0625rem; line-height:1.55;
}
h1,h2,p{ margin:0; }
a{ color:var(--accent-ink); text-decoration-thickness:1px; text-underline-offset:2px; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:1px; }
.wrap{ width:100%; max-width:60rem; margin-inline:auto; padding-inline:16px; }

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:var(--bg); background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-in{ display:flex; align-items:center; gap:1rem; min-height:3.1rem; }
.mark{ font-family:var(--f-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.mark b{ color:var(--ink); font-weight:400; border-bottom:2px solid var(--accent); padding-bottom:1px; }
.home{ margin-left:auto; font-family:var(--f-mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; }
@media (max-width:480px){ .mark-sub{ display:none; } }

/* ---------- layout ---------- */
main{ display:grid; gap:16px; padding-block:18px 120px; }
@media (min-width:760px){ main{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:start; } }
.card{ background:var(--card); border:1px solid var(--line); border-radius:3px; padding:18px 16px 20px; }
.label{ font-family:var(--f-mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:18px 0 8px; }
h2.label{ margin-top:0; font-weight:400; }

/* ---------- buttons and controls ---------- */
.btn{
  font-family:var(--f-mono); font-size:.74rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink); background:var(--card); border:1px solid var(--line);
  padding:.5rem .75rem; border-radius:2px; cursor:pointer; line-height:1.3; min-height:2.6rem;
}
.btn:hover{ border-color:var(--accent); color:var(--accent-ink); }
.btn.on,.btn[aria-pressed="true"]{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--bg); }
.btn.primary:hover{ color:var(--bg); filter:brightness(1.08); }
.btn.big{ font-size:.86rem; min-height:3.2rem; padding-inline:1.1rem; }
.btn:disabled{ opacity:.45; cursor:default; }
.row{ display:flex; flex-wrap:wrap; gap:8px; }
.ctrls{ justify-content:center; margin-top:14px; }
.ctrls{ flex-wrap:nowrap; }
.ctrls .btn{ flex:1 1 0; min-width:0; max-width:11rem; padding-inline:.4rem; }
.presets{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); }
.presets .btn{ text-transform:none; letter-spacing:.04em; white-space:nowrap; padding-inline:.3rem; }
.field{ display:flex; flex-direction:column; gap:4px; font-family:var(--f-mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.field input, .field select{
  font-family:var(--f-mono); font-size:1rem; letter-spacing:0; text-transform:none; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:.5rem .55rem; min-height:2.6rem; width:100%;
}
.field input[type=range]{ padding:0; min-height:2rem; background:none; border:0; accent-color:var(--accent); }
.custom{ align-items:flex-end; }
.custom .field{ flex:1 1 5rem; }
.custom .btn{ flex:0 0 auto; }
.grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 12px; }
.grid2 .wide{ grid-column:1 / -1; }
@media (max-width:360px){ .grid2{ grid-template-columns:1fr; } }
.chk{ display:flex; align-items:center; gap:.55rem; margin-top:14px; font-size:.95rem; cursor:pointer; }
.chk input{ width:1.15rem; height:1.15rem; accent-color:var(--accent); margin:0; }
.note{ margin-top:12px; font-size:.86rem; color:var(--muted); line-height:1.5; }

/* ---------- the clock ---------- */
.ring{ position:relative; width:min(100%, 21rem); aspect-ratio:1; margin:6px auto 0; }
.ring svg{ width:100%; height:100%; display:block; transform:rotate(-90deg); }
.ring .track{ fill:none; stroke:var(--line-soft); stroke-width:9; }
.ring .prog{ fill:none; stroke:var(--accent); stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .25s linear; }
.ring.done .prog{ stroke:var(--flag); }
.ring-in{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.time{ font-family:var(--f-display); font-size:clamp(3.4rem, 17vw, 5.6rem); line-height:1; font-variant-numeric:tabular-nums; letter-spacing:.01em; }
.status{ margin-top:6px; font-family:var(--f-mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.ring.done .status{ color:var(--flag); }

/* ---------- the piano roll ---------- */
.roll{ width:100%; height:auto; display:block; margin-top:12px; background:var(--surface); border:1px solid var(--line-soft); border-radius:2px; }
.roll .nt{ fill:var(--accent); opacity:.85; }
.roll .nt.past{ fill:var(--bronze); opacity:.6; }
.roll .grid{ stroke:var(--line-soft); stroke-width:1; }
.roll .head{ stroke:var(--flag); stroke-width:1.5; }
.roll text{ font-family:var(--f-mono); font-size:8px; fill:var(--muted); }
.credit{ margin-top:8px; font-size:.84rem; color:var(--muted); }

/* ---------- time's up ---------- */
.up{
  position:fixed; left:0; right:0; bottom:0; z-index:50; padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--flag-soft); border-top:2px solid var(--flag); display:flex; align-items:center; gap:12px; justify-content:center; flex-wrap:wrap;
}
.up p{ font-family:var(--f-display); font-size:1.7rem; line-height:1.1; color:var(--flag); }
.up .btn{ min-width:7rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <p class="mark"><b>Timer</b><span class="mark-sub"> &nbsp;/&nbsp; with a little tune</span></p>
    <a class="home" href="/">agastyasilvina.github.io</a>
  </div>
</header>

<main class="wrap">
  <section class="card" aria-label="Countdown">
    <div class="ring" id="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="90"></circle>
        <circle class="prog" id="prog" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="ring-in">
        <div class="time" id="time" role="timer" aria-live="off">25:00</div>
        <p class="status" id="status" aria-live="polite">Ready</p>
      </div>
    </div>
    <div class="row ctrls">
      <button class="btn big primary" id="go" type="button">Start</button>
      <button class="btn big" id="reset" type="button">Reset</button>
      <button class="btn big" id="plus" type="button">+1 min</button>
    </div>

    <p class="label">Quick set</p>
    <div class="row presets" id="presets"></div>

    <p class="label">Or exactly</p>
    <div class="row custom">
      <label class="field">Minutes<input id="mm" type="number" inputmode="numeric" min="0" max="599" value="25"></label>
      <label class="field">Seconds<input id="ss" type="number" inputmode="numeric" min="0" max="59" value="0"></label>
      <button class="btn big" id="set" type="button">Set</button>
    </div>
    <p class="note">Space starts and pauses; R resets.</p>
  </section>

  <section class="card" aria-label="The tune">
    <h2 class="label">The tune when time’s up</h2>
    <div class="grid2">
      <label class="field wide">Tune<select id="tune"></select></label>
      <label class="field">Sound
        <select id="sound">
          <option value="chip">8-bit</option>
          <option value="soft">soft</option>
          <option value="bell">bell</option>
        </select>
      </label>
      <label class="field">Play it
        <select id="repeat">
          <option value="1">once</option>
          <option value="3">3 times</option>
          <option value="0">until I stop it</option>
        </select>
      </label>
      <label class="field wide">Volume<input id="vol" type="range" min="0" max="1" step="0.05" value="0.6"></label>
    </div>
    <svg class="roll" id="roll" viewBox="0 0 320 120" role="img" aria-label="The tune as a piano roll: one bar per note, higher notes higher up"></svg>
    <p class="credit" id="credit"></p>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="preview" type="button">&#9654; Preview</button>
      <button class="btn" id="midi" type="button">Download MIDI</button>
    </div>
    <label class="chk" id="wakeRow"><input type="checkbox" id="wake"> Keep the screen on while it runs</label>
    <p class="note">The tune can only play while this page is open. Phones pause pages when the screen locks, so leave it open, or tick the box above.</p>
  </section>
</main>

<div class="up" id="up" role="alert" hidden>
  <p id="upText">Time’s up!</p>
  <button class="btn big primary" id="stop" type="button">Stop</button>
  <button class="btn big" id="again" type="button">Again</button>
</div>

<script>
(function(){
  "use strict";
  /* ================================================================ the tunes: [note, beats], "-" is a rest */
  var TUNES = [
    { id: "done", name: "Done! (an original chime)", bpm: 132, program: 10,
      credit: "An original little chime, written for this timer.",
      notes: [["G4",.5],["C5",.5],["E5",.5],["G5",.5],["E5",.5],["C5",.5],["D5",1],
              ["F5",.5],["E5",.5],["D5",.5],["B4",.5],["C5",2]] },
    { id: "westminster", name: "Westminster chimes", bpm: 96, program: 14,
      credit: "The clock chime of Big Ben, written for Great St Mary’s, Cambridge, in 1793. Public domain.",
      notes: [["E4",1],["G#4",1],["F#4",1],["B3",2],["-",1],
              ["E4",1],["F#4",1],["G#4",1],["E4",2],["-",1],
              ["G#4",1],["E4",1],["F#4",1],["B3",2],["-",1],
              ["B3",1],["F#4",1],["G#4",1],["E4",2],["-",1],
              ["E3",4]] },
    { id: "ode", name: "Ode to Joy", bpm: 120, program: 0,
      credit: "From Beethoven’s Ninth Symphony (1824). Public domain.",
      notes: [["E5",1],["E5",1],["F5",1],["G5",1],["G5",1],["F5",1],["E5",1],["D5",1],
              ["C5",1],["C5",1],["D5",1],["E5",1],["E5",1.5],["D5",.5],["D5",2],
              ["E5",1],["E5",1],["F5",1],["G5",1],["G5",1],["F5",1],["E5",1],["D5",1],
              ["C5",1],["C5",1],["D5",1],["E5",1],["D5",1.5],["C5",.5],["C5",2]] },
    { id: "sakura", name: "Sakura Sakura", bpm: 80, program: 107,
      credit: "さくら さくら, a Japanese folk song from the Edo period. Public domain.",
      notes: [["A4",1],["A4",1],["B4",2],["A4",1],["A4",1],["B4",2],
              ["A4",1],["B4",1],["C5",1],["B4",1],["A4",1],["B4",.5],["A4",.5],["F4",2],
              ["E4",1],["C4",1],["E4",1],["F4",1],["E4",1],["E4",.5],["C4",.5],["B3",2],
              ["A4",1],["B4",1],["C5",1],["B4",1],["A4",1],["B4",.5],["A4",.5],["F4",2],
              ["E4",1],["C4",1],["E4",1],["F4",1],["E4",1],["E4",.5],["C4",.5],["B3",2],
              ["A4",1],["A4",1],["B4",2],["A4",1],["A4",1],["B4",2],
              ["E4",1],["F4",1],["B4",.5],["A4",.5],["F4",1],["E4",4]] },
    { id: "twinkle", name: "Twinkle Twinkle Little Star", bpm: 112, program: 9,
      credit: "The old French tune “Ah ! vous dirai-je, maman”. Public domain.",
      notes: [["C5",1],["C5",1],["G5",1],["G5",1],["A5",1],["A5",1],["G5",2],
              ["F5",1],["F5",1],["E5",1],["E5",1],["D5",1],["D5",1],["C5",2],
              ["G5",1],["G5",1],["F5",1],["F5",1],["E5",1],["E5",1],["D5",2],
              ["G5",1],["G5",1],["F5",1],["F5",1],["E5",1],["E5",1],["D5",2],
              ["C5",1],["C5",1],["G5",1],["G5",1],["A5",1],["A5",1],["G5",2],
              ["F5",1],["F5",1],["E5",1],["E5",1],["D5",1],["D5",1],["C5",2]] }
  ];
  var PRESETS = [1, 3, 5, 10, 15, 25, 45, 60];
  var SKEY = "timer.settings.v1", RKEY = "timer.run.v1";

  function $(id){ return document.getElementById(id); }
  function load(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  function save(k, v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function tuneById(id){ for (var i = 0; i < TUNES.length; i++) if (TUNES[i].id === id) return TUNES[i]; return TUNES[0]; }
  function noteNum(name){
    var m = /^([A-G])(#|b)?(-?\d)$/.exec(name);
    return { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  }
  function beats(t){ return t.notes.reduce(function(a, n){ return a + n[1]; }, 0); }

  /* ================================================================ settings */
  var st = load(SKEY) || {};
  var settings = {
    total: st.total > 0 ? st.total : 25 * 60,
    tune: tuneById(st.tune).id,
    sound: ["chip", "soft", "bell"].indexOf(st.sound) >= 0 ? st.sound : "chip",
    repeat: [0, 1, 3].indexOf(st.repeat) >= 0 ? st.repeat : 3,
    vol: typeof st.vol === "number" ? Math.min(1, Math.max(0, st.vol)) : 0.6,
    wake: !!st.wake
  };
  function keep(){ save(SKEY, settings); }

  /* ================================================================ sound: a tiny synth on the Web Audio API */
  var ctx = null, bus = null, playing = null;
  function audio(){
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === "suspended") ctx.resume();
    if (!bus) { bus = ctx.createGain(); bus.gain.value = settings.vol; bus.connect(ctx.destination); }
    return ctx;
  }
  function voice(midi, t, dur, sound){
    var f = 440 * Math.pow(2, (midi - 69) / 12), g = ctx.createGain(), parts, peak;
    g.connect(bus);
    if (sound === "bell") {
      parts = [[1, 1], [2, .35], [3, .15], [4.2, .08]];
      peak = .32;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + .008);
      g.gain.exponentialRampToValueAtTime(.0001, t + Math.max(.6, dur * 1.8));
      parts.forEach(function(p){
        var o = ctx.createOscillator(), pg = ctx.createGain();
        o.type = "sine"; o.frequency.value = f * p[0]; pg.gain.value = p[1];
        o.connect(pg); pg.connect(g);
        o.start(t); o.stop(t + Math.max(.6, dur * 1.8) + .05);
      });
      return;
    }
    var o = ctx.createOscillator();
    o.type = sound === "chip" ? "square" : "triangle";
    o.frequency.value = f;
    o.connect(g);
    peak = sound === "chip" ? .11 : .38;
    var end = t + dur;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + .01);
    g.gain.setValueAtTime(peak * .8, Math.max(t + .011, end - .04));
    g.gain.exponentialRampToValueAtTime(.0001, end + .05);
    o.start(t); o.stop(end + .08);
  }
  /* schedule one pass of a tune; returns its length in seconds */
  function pass(tune, sound, t0){
    var spb = 60 / tune.bpm, t = t0;
    tune.notes.forEach(function(n){
      var d = n[1] * spb;
      if (n[0] !== "-") voice(noteNum(n[0]), t, d * .9, sound);
      t += d;
    });
    return t - t0;
  }
  function stopTune(){
    if (playing) { clearTimeout(playing.timer); playing = null; }
    if (bus) { bus.disconnect(); bus = null; }      /* everything already scheduled goes quiet with it */
    $("preview").innerHTML = "&#9654; Preview";
    drawRoll();
  }
  /* play a tune `times` times (0 = until stopped); onEnd runs when it finishes by itself */
  function playTune(id, times, onEnd){
    stopTune();
    if (!audio()) return false;
    var tune = tuneById(id), count = 0, gap = .6;
    playing = { tune: tune, start: 0, len: 0, timer: 0 };
    function next(){
      var t0 = ctx.currentTime + .08;
      var len = pass(tune, settings.sound, t0);
      count++;
      playing.start = t0; playing.len = len;
      var more = times === 0 || count < times;
      playing.timer = setTimeout(function(){
        if (!playing) return;
        if (more) next(); else { stopTune(); if (onEnd) onEnd(); }
      }, (len + (more ? gap : .2)) * 1000);
    }
    next();
    requestAnimationFrame(animate);
    return true;
  }

  /* ================================================================ the piano roll */
  function drawRoll(at){
    var tune = tuneById(settings.tune), total = beats(tune), lo = 127, hi = 0, x0 = 22, w = 292, top = 8, h = 96;
    tune.notes.forEach(function(n){ if (n[0] !== "-") { var k = noteNum(n[0]); lo = Math.min(lo, k); hi = Math.max(hi, k); } });
    lo -= 1; hi += 1;
    var rowH = h / (hi - lo + 1), g = "", b = 0;
    for (var bt = 0; bt <= total; bt += 4) {
      var gx = x0 + bt / total * w;
      g += '<line class="grid" x1="' + gx.toFixed(1) + '" y1="' + top + '" x2="' + gx.toFixed(1) + '" y2="' + (top + h) + '"/>';
    }
    tune.notes.forEach(function(n){
      if (n[0] !== "-") {
        var k = noteNum(n[0]), x = x0 + b / total * w, nw = Math.max(1.5, n[1] / total * w - 1.2), y = top + (hi - k) * rowH;
        g += '<rect class="nt' + (at !== undefined && b < at ? " past" : "") + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + nw.toFixed(1) + '" height="' + Math.max(2, rowH - 1).toFixed(1) + '" rx="1"/>';
      }
      b += n[1];
    });
    g += '<text x="2" y="' + (top + 7) + '">' + highName(hi - 1) + '</text><text x="2" y="' + (top + h) + '">' + highName(lo + 1) + '</text>';
    g += '<text x="' + (x0 + w) + '" y="' + (top + h + 13) + '" text-anchor="end">' + total + ' beats · ' + tune.bpm + ' bpm</text>';
    if (at !== undefined) { var hx = (x0 + at / total * w).toFixed(1); g += '<line class="head" x1="' + hx + '" y1="' + (top - 4) + '" x2="' + hx + '" y2="' + (top + h + 4) + '"/>'; }
    $("roll").innerHTML = g;
    $("credit").textContent = tune.credit;
  }
  function highName(k){ return ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"][k % 12] + (Math.floor(k / 12) - 1); }
  function animate(){
    if (!playing || !ctx) return;
    if (playing.tune.id === settings.tune && playing.len > 0) {
      var f = (ctx.currentTime - playing.start) / playing.len;
      if (f >= 0 && f <= 1) drawRoll(f * beats(playing.tune));
    }
    requestAnimationFrame(animate);
  }

  /* ================================================================ MIDI: a standard MIDI file, written by hand */
  function vlq(n){ var out = [n & 0x7F]; n >>>= 7; while (n > 0) { out.unshift((n & 0x7F) | 0x80); n >>>= 7; } return out; }
  function u32(n){ return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255]; }
  function ascii(s){ var out = []; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); out.push(c < 128 ? c : 63); } return out; }
  function midiFile(tune){
    var tpq = 480, us = Math.round(60000000 / tune.bpm), name = ascii(tune.name.replace(/[^\x20-\x7E]/g, "").trim()), ev = [], wait = 0;
    ev = ev.concat([0, 0xFF, 0x03], vlq(name.length), name);
    ev = ev.concat([0, 0xFF, 0x51, 3, (us >>> 16) & 255, (us >>> 8) & 255, us & 255]);
    ev = ev.concat([0, 0xC0, tune.program & 127]);
    tune.notes.forEach(function(n){
      var ticks = Math.round(n[1] * tpq);
      if (n[0] === "-") { wait += ticks; return; }
      var k = noteNum(n[0]), on = Math.max(1, Math.round(ticks * .92));
      ev = ev.concat(vlq(wait), [0x90, k, 96], vlq(on), [0x80, k, 0]);
      wait = ticks - on;
    });
    ev = ev.concat(vlq(wait), [0xFF, 0x2F, 0]);
    var head = ascii("MThd").concat(u32(6), [0, 0, 0, 1, (tpq >>> 8) & 255, tpq & 255]);
    return new Uint8Array(head.concat(ascii("MTrk"), u32(ev.length), ev));
  }
  $("midi").addEventListener("click", function(){
    var tune = tuneById(settings.tune), url = URL.createObjectURL(new Blob([midiFile(tune)], { type: "audio/midi" }));
    var a = document.createElement("a");
    a.href = url; a.download = tune.id + ".mid";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  });

  /* ================================================================ the countdown */
  var total = settings.total, left = total, endAt = 0, running = false, paused = false, ticker = 0, lock = null;
  var RING = 2 * Math.PI * 90;
  $("prog").setAttribute("stroke-dasharray", RING.toFixed(2));
  function fmt(s){
    s = Math.max(0, Math.ceil(s - 1e-6));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (ss < 10 ? "0" : "") + ss;
  }
  function render(status){
    $("time").textContent = fmt(left);
    $("prog").setAttribute("stroke-dashoffset", (RING * (1 - (total > 0 ? Math.max(0, Math.min(1, left / total)) : 0))).toFixed(2));
    if (status) $("status").textContent = status;
    $("go").textContent = running ? "Pause" : paused ? "Resume" : "Start";
    document.title = running ? fmt(left) + " · Timer" : left <= 0 ? "Time’s up! · Timer" : "Timer";
    Array.prototype.forEach.call($("presets").children, function(b){
      var on = !running && +b.getAttribute("data-min") * 60 === total;
      b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }
  function tick(){
    left = (endAt - Date.now()) / 1000;
    if (left <= 0) finish(false); else render();
  }
  function start(){
    if (left <= 0) left = total;
    audio();                                   /* a tap now lets the tune play later */
    endAt = Date.now() + left * 1000;
    running = true; paused = false;
    save(RKEY, { endAt: endAt, total: total });
    clearInterval(ticker); ticker = setInterval(tick, 250);
    $("ring").classList.remove("done");
    wakeOn();
    render("Running");
  }
  function pause(){
    left = Math.max(0, (endAt - Date.now()) / 1000);
    running = false; paused = true;
    clearInterval(ticker);
    save(RKEY, null);
    wakeOff();
    render("Paused");
  }
  function setTotal(sec){
    sec = Math.max(1, Math.min(599 * 60 + 59, Math.round(sec)));
    total = left = sec; running = false; paused = false;
    clearInterval(ticker); save(RKEY, null); wakeOff();
    settings.total = sec; keep();
    $("mm").value = Math.floor(sec / 60); $("ss").value = sec % 60;
    $("ring").classList.remove("done"); hideUp();
    render("Ready");
  }
  function finish(late){
    running = false; paused = false; left = 0;
    clearInterval(ticker); save(RKEY, null); wakeOff();
    $("ring").classList.add("done");
    render(late ? "Finished while you were away" : "Time’s up");
    $("upText").textContent = late ? "Time was up while you were away" : "Time’s up!";
    $("up").hidden = false;
    if (!late) {
      playTune(settings.tune, settings.repeat, function(){ });
      if (navigator.vibrate) try { navigator.vibrate([300, 150, 300, 150, 600]); } catch (e) {}
    }
  }
  function hideUp(){ $("up").hidden = true; }

  /* ---------- keep the screen on, where the browser allows it ---------- */
  function wakeOn(){
    if (!settings.wake || !("wakeLock" in navigator) || lock) return;
    navigator.wakeLock.request("screen").then(function(l){ lock = l; l.addEventListener("release", function(){ lock = null; }); }).catch(function(){});
  }
  function wakeOff(){ if (lock) { lock.release().catch(function(){}); lock = null; } }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible") { if (running) { tick(); wakeOn(); } }
  });
  if (!("wakeLock" in navigator)) $("wakeRow").hidden = true;

  /* ================================================================ wiring */
  PRESETS.forEach(function(m){
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn"; b.textContent = m + " min"; b.setAttribute("data-min", m);
    b.addEventListener("click", function(){ setTotal(m * 60); });
    $("presets").appendChild(b);
  });
  TUNES.forEach(function(t){ var o = document.createElement("option"); o.value = t.id; o.textContent = t.name; $("tune").appendChild(o); });
  $("tune").value = settings.tune; $("sound").value = settings.sound; $("repeat").value = String(settings.repeat);
  $("vol").value = settings.vol; $("wake").checked = settings.wake;

  $("go").addEventListener("click", function(){ if (running) pause(); else { stopTune(); hideUp(); start(); } });
  $("reset").addEventListener("click", function(){ stopTune(); setTotal(settings.total); });   /* back to the time you chose */
  $("plus").addEventListener("click", function(){
    if (running) { endAt += 60000; total += 60; save(RKEY, { endAt: endAt, total: total }); tick(); return; }
    stopTune(); hideUp();
    if (left <= 0) { total = left = 60; start(); return; }          /* after time’s up: a one-minute snooze */
    left += 60; total += 60;
    render(left < total ? "Paused" : "Ready");
  });
  $("set").addEventListener("click", function(){
    var m = Math.max(0, parseInt($("mm").value, 10) || 0), s = Math.max(0, Math.min(59, parseInt($("ss").value, 10) || 0));
    setTotal(m * 60 + s);
  });
  $("stop").addEventListener("click", function(){ stopTune(); hideUp(); render("Ready"); });
  $("again").addEventListener("click", function(){ stopTune(); hideUp(); total = left = settings.total; start(); });
  $("tune").addEventListener("change", function(){ settings.tune = this.value; keep(); stopTune(); });
  $("sound").addEventListener("change", function(){ settings.sound = this.value; keep(); });
  $("repeat").addEventListener("change", function(){ settings.repeat = parseInt(this.value, 10); keep(); });
  $("vol").addEventListener("input", function(){ settings.vol = parseFloat(this.value); keep(); if (bus) bus.gain.value = settings.vol; });
  $("wake").addEventListener("change", function(){ settings.wake = this.checked; keep(); if (running && this.checked) wakeOn(); else wakeOff(); });
  $("preview").addEventListener("click", function(){
    if (playing) { stopTune(); return; }
    if (playTune(settings.tune, 1, function(){})) $("preview").innerHTML = "&#9632; Stop";
  });
  document.addEventListener("keydown", function(e){
    if (e.target && /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) return;
    if (e.key === " ") { e.preventDefault(); $("go").click(); }
    else if (e.key === "r" || e.key === "R") $("reset").click();
  });

  /* ---------- pick up a timer that was running when the page was closed ---------- */
  var run = load(RKEY);
  $("mm").value = Math.floor(total / 60); $("ss").value = total % 60;
  drawRoll();
  if (run && run.endAt && run.total > 0) {
    total = run.total;
    if (run.endAt > Date.now()) {
      endAt = run.endAt; left = (endAt - Date.now()) / 1000; running = true;
      clearInterval(ticker); ticker = setInterval(tick, 250);
      render("Running · tap the page once so the tune can play");
      document.addEventListener("pointerdown", function once(){ audio(); document.removeEventListener("pointerdown", once); if (running) render("Running"); });
    } else finish(true);
  } else render("Ready");
})();
</script>
</body>
</html>
